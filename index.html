  INA:"🇮🇩",HKG:"🇭🇰",SYR:"🇸🇾",MGL:"🇲🇳",TPE:"🇹🇼",
  IND:"🇮🇳",LBN:"🇱🇧",MAS:"🇲🇾",TJK:"🇹🇯",
};
const LAST_SCORED = {"name": "Chinese Taipei", "team": "TPE", "apparatus": "5balls", "apparatus_label": "5 balls", "score": 21.55, "cat_id": "172851"};

const DISC_LABEL = {individual:"IND",group:"GRP"};
let active = null;

function esc(s) {
  return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}

function renderOnCarpet() {
  const el = document.getElementById("on-carpet");
  if (!LAST_SCORED) { el.style.display = "none"; return; }
  const flag = FLAG_MAP[LAST_SCORED.team] || "🏳️";
  el.style.display = "flex";
  el.innerHTML = `
    <span class="on-carpet-label">Last scored</span>
    <span class="on-carpet-flag">${flag}</span>
    <span class="on-carpet-name">${esc(LAST_SCORED.name)}</span>
    <div class="on-carpet-score">
      <span class="app">${esc(LAST_SCORED.apparatus_label)}</span>
      <span class="val">${Number(LAST_SCORED.score).toFixed(2)}</span>
    </div>`;
}

function render() {
  const tabs = document.getElementById("tabs");
  const content = document.getElementById("content");

  const maxScore = {};
  CATEGORIES.forEach(c => {
    let mx = 0;
    c.competitors.forEach(a => { if (a.final_total && a.final_total > mx) mx = a.final_total; });
    maxScore[c.id] = mx || 60;
  });

  // Default to the category of the last scored athlete, fallback to first with results
  if (active === null) {
    if (LAST_SCORED && LAST_SCORED.cat_id) {
      const lsCat = CATEGORIES.find(c => c.id === LAST_SCORED.cat_id && c.has_results);
      if (lsCat) active = lsCat.id;
    }
    if (!active) {
      const first = CATEGORIES.find(c => c.has_results) || CATEGORIES[0];
      if (first) active = first.id;
    }
  }

  tabs.innerHTML = CATEGORIES.map(c => {
    const isActive = active === c.id;
    return `<button class="tab ${isActive?"active":""}" onclick="switchTab('${c.id}')">
      ${esc(c.title)}
      <span class="cnt">${c.competitors.length}</span>
      ${c.has_results ? '<span class="dot"></span>' : ""}
    </button>`;
  }).join("");

  content.innerHTML = CATEGORIES.map(c => {
    return `<div class="panel ${active===c.id?"active":""}" id="pnl-${c.id}">
      ${renderPanel(c, maxScore[c.id])}
    </div>`;
  }).join("");
}

function renderPanel(cat, maxTotal) {
  const ranked = cat.competitors.filter(a => a.rank !== null).sort((a,b) => a.rank - b.rank);
  if (!ranked.length) {
    return `<div class="empty-cat">No results yet</div>`;
  }
  return ranked.map(a => renderRow(a, cat.score_names, maxTotal)).join("");
}

function renderRow(app, scoreNames, maxTotal) {
  const r = app.rank;
  const flag = FLAG_MAP[app.team] || "🏳️";
  const total = app.final_total;

  const scorePills = scoreNames.map(sn => {
    const s = app.scores[sn.char_id];
    if (!s) return "";
    const label = s.is_dns?"DNS":s.is_dnf?"DNF":s.is_dsq?"DSQ":null;
    return `<div class="score-pill">
      <span class="app">${esc(sn.short_title)}</span>
      <span class="val">${label || s.total.toFixed(2)}</span>
    </div>`;
  }).filter(Boolean).join("");

  return `<div class="result-row">
    <div class="rank-num">${r}</div>
    <div class="mid-col">
      <div class="athlete-row">
        <span class="flag">${flag}</span>
        <span class="athlete-name">${esc(app.name)}</span>
        <span class="country-code">${esc(app.team)}</span>
      </div>
      <div class="scores-row">${scorePills}</div>
    </div>
    <div class="right-col">
      <div class="total-score">${total != null ? total.toFixed(2) : "—"}</div>
    </div>
  </div>`;
}

function switchTab(catId) {
  active = catId;
  document.querySelectorAll(".tab").forEach(b => {
    b.classList.toggle("active", b.getAttribute("onclick").includes(`'${catId}'`));
  });
  document.querySelectorAll(".panel").forEach(p => {
    p.classList.toggle("active", p.id === `pnl-${catId}`);
  });
}

renderOnCarpet();
render();
</script>
</body>
</html>
