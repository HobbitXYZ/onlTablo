    .overlay {

    .sticky-top { position: sticky; top: 0; z-index: 100; }

    /* Header */
    .hdr {

      text-align: center;
      border-bottom: 1px solid rgba(255,255,255,0.12);
      background: #12203E;
    }
    .lang-select {

      top: 12px;
      right: 16px;
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.2);
      color: #fff;
      border-radius: 6px;
      padding: 3px 6px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      outline: none;
    }
    .lang-select option { background: #12203E; color: #fff; }
    .logo-wrap {
      display: flex;
      justify-content: center;
      margin-bottom: 8px;
    }
    .logo-wrap img {
      height: 28px;
      /* no filter - keep original colors */
    }
    .event-name {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      line-height: 1.3;
      color: rgba(255,255,255,0.95);
    }
    .event-meta {
      font-size: 11px;
      color: rgba(255,255,255,0.5);
      margin-top: 2px;
    }
    .live-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 20px;
      padding: 2px 10px;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      margin-top: 6px;
      color: rgba(255,255,255,0.75);
    }
    .live-dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: #3fb950;
      animation: blink 1.5s infinite;
    }
    @keyframes blink {
      0%,100% { opacity:1; }
      50% { opacity: 0.3; }
    }

    /* On carpet banner */
    .on-carpet {
      display: flex;
      flex-direction: column;
      gap: 4px;
      background: rgba(18,32,62,0.92);
      border-top: 1px solid rgba(255,255,255,0.08);
      border-bottom: 1px solid rgba(255,255,255,0.08);
      padding: 7px 16px;
    }
    .on-carpet-label {
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: rgba(255,255,255,0.5);
    }
    .on-carpet-row {
      display: flex;
      align-items: center;
      gap: 7px;
    }
    .on-carpet-name {
      font-weight: 600;
      color: #fff;
      font-size: 14px;
      flex: 1;
    }
    .on-carpet-flag { font-size: 17px; }
    .on-carpet-score {
      display: flex;
      align-items: center;
      gap: 5px;
      background: rgba(0,0,0,0.2);
      border-radius: 6px;
      padding: 2px 8px;
      font-size: 12px;
      flex-shrink: 0;
    }
    .on-carpet-score .app { color: rgba(255,255,255,0.5); font-size: 11px; }
    .on-carpet-score .val { font-weight: 700; color: #fff; }

    /* Tabs */
    .tabs {
      display: flex;
      gap: 8px;
      padding: 10px 14px;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
      border-bottom: 1px solid rgba(255,255,255,0.08);
      background: rgba(18,32,62,0.88);

      padding: 5px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      border: 1.5px solid rgba(255,255,255,0.2);
      background: rgba(255,255,255,0.07);
      color: rgba(255,255,255,0.55);
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s;
    }
    .tab.active {
      background: #00AEEE;
      border-color: #00AEEE;
      color: #fff;
    }
    .tab .cnt {
      font-size: 10px;
      opacity: 0.7;
      margin-left: 4px;
    }
    .tab .dot {
      width: 5px; height: 5px;
      border-radius: 50%;
      background: #3fb950;
      display: inline-block;
      margin-left: 4px;
      vertical-align: middle;
    }

    .panel { display: none; }
    .panel.active { display: block; }

    /* Empty category */
    .empty-cat {
      text-align: center;
      padding: 40px 20px;
      color: rgba(255,255,255,0.35);
      font-size: 13px;
    }

    /* Result rows */
    .result-row {
      display: grid;
      grid-template-columns: 28px 1fr auto;
      align-items: center;
      gap: 6px;
      padding: 8px 8px;
      border-radius: 10px;
      margin-bottom: 4px;
      background: rgba(255,255,255,0.07);
      border: 1px solid rgba(255,255,255,0.06);

      text-align: center;
      font-size: 13px;
      font-weight: 700;
      color: rgba(255,255,255,0.5);
      align-self: center;
    }

      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .athlete-row {
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .flag { font-size: 17px; line-height: 1; flex-shrink: 0; }
    .athlete-name {

      font-weight: 600;
      color: #fff;
      white-space: nowrap;

      letter-spacing: 0.5px;

      gap: 4px;
      flex-wrap: wrap;

      border-radius: 5px;

      flex-shrink: 0;

function esc(s) {
  return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}

function renderOnCarpet() {
  const el = document.getElementById("on-carpet");
  if (!LAST_SCORED) { el.style.display = "none"; return; }

  el.innerHTML = `

      </div>
    </div>`;
}

function render() {
  const tabs = document.getElementById("tabs");
  const content = document.getElementById("content");

  const maxScore = {};
  CATEGORIES.forEach(c => {
    let mx = 0;
    c.competitors.forEach(a => { if (a.final_total && a.final_total > mx) mx = a.final_total; });
    maxScore[c.id] = mx || 60;
  });

  // Default to the category of the last scored athlete, fallback to first with results
  if (active === null) {
    const saved = localStorage.getItem("activeTab");
    if (saved && CATEGORIES.find(c => c.id === saved)) {
      active = saved;
    } else if (LAST_SCORED && LAST_SCORED.cat_id) {
      const lsCat = CATEGORIES.find(c => c.id === LAST_SCORED.cat_id && c.has_results);
      if (lsCat) active = lsCat.id;
    }
    if (!active) {
      const first = CATEGORIES.find(c => c.has_results) || CATEGORIES[0];
      if (first) active = first.id;
    }
  }

  tabs.innerHTML = CATEGORIES.map(c => {
    const isActive = active === c.id;
    return `<button class="tab ${isActive?"active":""}" onclick="switchTab('${c.id}')">
      ${esc(c.title)}
      <span class="cnt">${c.competitors.length}</span>
      ${c.has_results ? '<span class="dot"></span>' : ""}
    </button>`;
  }).join("");

  content.innerHTML = CATEGORIES.map(c => {
    return `<div class="panel ${active===c.id?"active":""}" id="pnl-${c.id}">
      ${renderPanel(c, maxScore[c.id])}
    </div>`;
  }).join("");
}

function renderPanel(cat, maxTotal) {
  const all = cat.competitors.filter(a => a.rank !== null).sort((a,b) => a.rank - b.rank);
  const scored = all.filter(a => a.final_total && a.final_total > 0);
  const pending = all.filter(a => !a.final_total || a.final_total === 0);

  if (scored.length > 0 && scored.every(a => !a.rank)) {
    scored.sort((a, b) => b.final_total - a.final_total);
    let rankNum = 1;
    scored.forEach((a, i) => {
      if (i > 0 && a.final_total === scored[i - 1].final_total) {
        a.rank = scored[i - 1].rank;
      } else {
        a.rank = rankNum;
      }
      rankNum++;
    });
  }

  if (!scored.length && !pending.length) {
    return `<div class="empty-cat">${t('noResults')}</div>`;
  }

  let html = "";

  if (pending.length) {
    const names = pending.map(a => esc(a.name)).join(" &nbsp;·&nbsp; ");
    html += `<div class="pending-row"><span class="pending-label">${t('awaiting')}</span><span class="pending-names">${names}</span></div>`;
  }

  html += scored.map(a => renderRow(a, cat.score_names, maxTotal)).join("");
  return html;
}

function renderRow(app, scoreNames, maxTotal) {
  const r = app.rank;
  const total = app.final_total;

  const scorePills = scoreNames.map(sn => {
    const s = app.scores[sn.char_id];
    if (!s) return "";
    const label = s.is_dns?"DNS":s.is_dnf?"DNF":s.is_dsq?"DSQ":null;
    return `<div class="score-pill">
      <span class="app">${esc(apparatusLabel(sn))}</span>
      <span class="val">${label || s.total.toFixed(2)}</span>
    </div>`;
  }).filter(Boolean).join("");

  return `<div class="result-row">
    <div class="rank-num">${r}</div>
    <div class="mid-col">
      <div class="athlete-row">
        <span class="athlete-name">${esc(app.name)}</span>
      </div>
      <span class="country-code">${esc(app.team)}</span>
      <div class="scores-row">${scorePills}</div>
    </div>
    <div class="right-col">
      <div class="total-score">${total != null ? total.toFixed(2) : "—"}</div>
    </div>
  </div>`;
}

function switchTab(catId) {
  active = catId;
  localStorage.setItem("activeTab", catId);
  document.querySelectorAll(".tab").forEach(b => {
    b.classList.toggle("active", b.getAttribute("onclick").includes(`'${catId}'`));
  });
  document.querySelectorAll(".panel").forEach(p => {
    p.classList.toggle("active", p.id === `pnl-${catId}`);
  });
}

updateLogo();
renderOnCarpet();
render();
</script>
</body>
</html>
